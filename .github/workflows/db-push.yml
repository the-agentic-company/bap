name: Push DB Schema

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        type: string
      environment:
        description: "Environment to target"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "main"
      environment:
        description: "Environment to target"
        required: true
        type: choice
        default: "staging"
        options:
          - "staging"
          - "prod"

jobs:
  db-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_GITHUB_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_GITHUB_OIDC_AUDIENCE }}
          tags: tag:bap-ci

      - name: Wait for database Tailscale peer
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail

          case "${ENVIRONMENT}" in
            staging | prod)
              database_peer="bap-postgres-tailscale-${ENVIRONMENT}"
              ;;
            *)
              echo "Unsupported environment: ${ENVIRONMENT}" >&2
              exit 1
              ;;
          esac

          for attempt in $(seq 1 18); do
            database_host="$(
              tailscale status --json | EXPECTED_PEER="${database_peer}" bun -e '
                const expectedPeer = process.env.EXPECTED_PEER;
                const status = JSON.parse(await Bun.stdin.text());
                const peers = Object.values(status.Peer ?? {});
                const peer = peers.find((candidate) => candidate.HostName === expectedPeer);
                const ipv4 = peer?.TailscaleIPs?.find((address) => address.includes("."));
                if (peer?.Online && ipv4) {
                  process.stdout.write(ipv4);
                }
              '
            )"

            if [ -n "${database_host}" ] && \
              tailscale ping --until-direct=false --timeout=10s --c=1 "${database_host}" \
                >/dev/null 2>&1; then
              echo "DATABASE_HOST_OVERRIDE=${database_host}" >> "${GITHUB_ENV}"
              echo "Database Tailscale peer is ready."
              exit 0
            fi

            echo "Database Tailscale peer is not ready on attempt ${attempt}/18; retrying in 10s."
            sleep 10
          done

          echo "Database Tailscale peer did not become ready after 3 minutes." >&2
          exit 1

      - name: Push DB changes
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          ENVIRONMENT: ${{ inputs.environment }}
          SKIP_ENV_VALIDATION: "1"
        shell: bash
        run: |
          set -euo pipefail

          case "${ENVIRONMENT}" in
            staging)
              export DATABASE_URL="${DATABASE_URL_STAGING}"
              ;;
            prod)
              export DATABASE_URL="${DATABASE_URL_PROD}"
              ;;
            *)
              echo "Unsupported environment: ${ENVIRONMENT}" >&2
              exit 1
              ;;
          esac

          if [ -z "${DATABASE_URL}" ]; then
            case "${ENVIRONMENT}" in
              staging)
                echo "Missing DATABASE_URL_STAGING secret" >&2
                ;;
              prod)
                echo "Missing DATABASE_URL_PROD secret" >&2
                ;;
            esac
            exit 1
          fi

          if [ -n "${DATABASE_HOST_OVERRIDE:-}" ]; then
            resolved_database_url="$(
              DATABASE_URL="${DATABASE_URL}" \
                DATABASE_HOST_OVERRIDE="${DATABASE_HOST_OVERRIDE}" \
                bun -e '
                  const databaseUrl = process.env.DATABASE_URL;
                  const databaseHost = process.env.DATABASE_HOST_OVERRIDE;
                  if (!databaseUrl || !databaseHost) throw new Error("Missing database endpoint");
                  const url = new URL(databaseUrl);
                  url.hostname = databaseHost;
                  process.stdout.write(url.toString());
                '
            )"
            export DATABASE_URL="${resolved_database_url}"
            case "${ENVIRONMENT}" in
              staging)
                export DATABASE_URL_STAGING="${resolved_database_url}"
                ;;
              prod)
                export DATABASE_URL_PROD="${resolved_database_url}"
                ;;
            esac
          fi

          max_attempts=5
          attempt=1
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          while true; do
            : > "$log_file"
            echo "Running db:push attempt ${attempt}/${max_attempts}"

            if bun run --cwd packages/db "db:push:${ENVIRONMENT}" 2>&1 | tee "$log_file"; then
              if grep -Eq "^error:" "$log_file"; then
                echo "db:push printed an error but exited successfully; failing CI." >&2
                exit 1
              fi
              exit 0
            fi

            if grep -Fq "Interactive prompts require a TTY terminal" "$log_file"; then
              prompt_context="$(grep -iE "you're about to|do you want to truncate|truncate the table|add unique|add constraint" "$log_file" || true)"
              echo >&2
              echo "db:push needs manual approval for a schema change and cannot continue in CI." >&2
              echo "Drizzle prompted for confirmation because the push may require a risky operation, such as truncating data or applying a constraint on existing rows." >&2
              if [ -n "$prompt_context" ]; then
                echo "Prompt context from Drizzle:" >&2
                echo "$prompt_context" >&2
              fi
              echo "Run the same db:push command manually in a TTY and decide how to handle the prompt." >&2
              exit 1
            fi

            if ! grep -Eiq "ECONNREFUSED|ECONNRESET|ETIMEDOUT|ENOTFOUND|ESERVFAIL|Connection terminated|timeout expired" "$log_file"; then
              exit 1
            fi

            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "db:push failed after ${max_attempts} transient connection attempts." >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "db:push hit a transient connection failure; retrying in ${sleep_seconds}s." >&2
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
